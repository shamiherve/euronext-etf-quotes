name: Euronext ETF quotes

on:
  schedule:
    - cron: '0 17 * * *'
    - cron: '15 21 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/quotes.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: euronext-quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate quote and calendar rules
        run: python -m unittest -v test_quotes.py

      - name: Retry until all four ETF quotes are available
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Attempt $attempt of 8"

            python update_quotes.py --gated || echo "Download attempt failed; retrying if possible."

            if python - <<'PY'
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from update_quotes import INSTRUMENTS, PARIS, read_previous, should_run

          now = datetime.now(timezone.utc)

          if not should_run(now):
              print("No eligible post-close trading session.")
              sys.exit(2)

          local = now.astimezone(PARIS)
          session = local.date() if local.hour >= 18 else (
              local - timedelta(days=1)
          ).date()

          quotes = read_previous(Path("docs/quotes.json"))

          if set(quotes) == set(INSTRUMENTS):
              days = {
                  datetime.fromisoformat(
                      q["trade_timestamp"].replace("Z", "+00:00")
                  ).astimezone(PARIS).date()
                  for q in quotes.values()
              }

              if days == {session}:
                  print("All four ETF quotes are available for the trading day.")
                  sys.exit(0)

          print("The four quotes are not yet available for the trading day.")
          sys.exit(1)
          PY
            then
              echo "All four quotes are ready."
              break
            else
              status=$?
              if [ "$status" -eq 2 ]; then
                echo "No eligible trading session; stopping retries."
                break
              fi
            fi

            if [ "$attempt" -lt 8 ]; then
              echo "Waiting 15 minutes before the next attempt."
              sleep 900
            fi
          done

      - name: Preserve latest valid quotes in repository
        run: |
          if ! git diff --quiet -- docs/quotes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/quotes.json
            git commit -m 'Update public Euronext delayed ETF quotes'
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        id: deployment
